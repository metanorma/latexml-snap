# yaml-language-server: $schema=https://raw.githubusercontent.com/canonical/snapcraft/refs/heads/main/schema/snapcraft.json
---
name: latexml
base: core24
summary: A LaTeX to XML/HTML/MathML Converter
description: |
  In the process of developing the Digital Library of Mathematical Functions, NIST had needed a means of transforming the LaTeX sources of our material into XML which would be used for further manipulations, rearrangements and construction of the web site. In particular, a true 'Digital Library' should focus on the semantics of the material, and so NIST should convert the mathematical material into both content and presentation MathML. At the time, there found no software suitable to our needs, so NIST began development of LaTeXML in-house.
grade: stable
adopt-info: latexml
confinement: strict
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]
  armhf:
    build-on: [armhf]
    build-for: [armhf]
  ppc64el:
    build-on: [ppc64el]
    build-for: [ppc64el]
  s390x:
    build-on: [s390x]
    build-for: [s390x]

parts:
  latexml:
    plugin: nil
    source: .
    override-pull: |
      craftctl default
      VERSION=$(cat $CRAFT_PROJECT_DIR/VERSION)
      echo "Setting snap version to '$VERSION'"
      craftctl set version="$VERSION"
    override-build: |
      apt update
      apt install -y libxml2-dev libxslt1-dev libicu-dev zlib1g-dev curl build-essential

      VERSION=$(cat $CRAFT_PROJECT_DIR/VERSION)

      # Install cpanm
      curl -o cpanminus.pl http://cpanmin.us
      perl -- cpanminus.pl App::cpanminus

      # Install cpanm packages with specific version
      cpanm --notest "XML::LibXSLT@1.96"
      cpanm --notest "LaTeXML@$VERSION"

      # Create perl5lib wrapper script
      perl_incs=$(perl -e 'print "@INC"')
      perl5lib_sh="$CRAFT_PART_INSTALL/usr/bin/perl5lib.sh"
      mkdir -p "$CRAFT_PART_INSTALL/usr/bin"
      cat <<EOF > "$perl5lib_sh"
      #!/bin/bash
      snap_prefix="\$1"
      shift
      perl_snap_inc=()
      for inc_path in $perl_incs; do
        if [ "\$inc_path" != "." ]; then
          perl_snap_inc+=("\$snap_prefix\$inc_path")
        fi
      done
      env PERL5LIB=\$(IFS=:; echo "\${perl_snap_inc[*]}") env PATH=\$snap_prefix/usr/local/bin:\$PATH \$@
      EOF
      chmod +x "$perl5lib_sh"

      # Workaround for unusual mode issue
      mkdir -p /usr/local/lib/python3.12/dist-packages 2>/dev/null || true
      chmod -R g-s /usr/local/lib 2>/dev/null || true

      craftctl default
    organize:
      /usr/bin/perl5lib.sh: /usr/bin/perl5lib.sh
      /usr/lib/x86_64-linux-gnu/perl: /usr/lib/x86_64-linux-gnu/perl
      /usr/lib/aarch64-linux-gnu/perl: /usr/lib/aarch64-linux-gnu/perl
      /usr/lib/arm-linux-gnueabihf/perl: /usr/lib/arm-linux-gnueabihf/perl
      /usr/lib/powerpc64le-linux-gnu/perl: /usr/lib/powerpc64le-linux-gnu/perl
      /usr/lib/s390x-linux-gnu/perl: /usr/lib/s390x-linux-gnu/perl
      /usr/share/perl: /usr/share/perl
      /usr/local: /usr/local
    stage-packages:
      - perl
      - perl-base
      - libicu74
      - libxml2
      - libxslt1.1
      - zlib1g

apps:
  latexml:
    environment:
      LC_ALL: "C.UTF-8"
    command: usr/bin/perl5lib.sh $SNAP $SNAP/usr/local/bin/latexml
    plugs:
      - home
      - network
  c:
    environment:
      LC_ALL: "C.UTF-8"
    command: usr/bin/perl5lib.sh $SNAP $SNAP/usr/local/bin/latexmlc
    plugs:
      - home
      - network
  find:
    environment:
      LC_ALL: "C.UTF-8"
    command: usr/bin/perl5lib.sh $SNAP $SNAP/usr/local/bin/latexmlfind
    plugs:
      - home
      - network
  math:
    environment:
      LC_ALL: "C.UTF-8"
    command: usr/bin/perl5lib.sh $SNAP $SNAP/usr/local/bin/latexmlmath
    plugs:
      - home
      - network
  post:
    environment:
      LC_ALL: "C.UTF-8"
    command: usr/bin/perl5lib.sh $SNAP $SNAP/usr/local/bin/latexmlpost
    plugs:
      - home
      - network
